name: CI

# Runner image pinned (ubuntu-latest moves to new Ubuntu releases on its own); actions on their
# Node 24 majors (final session A).
on:
  push:
    branches: [main, 'phase-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: processhub
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: processhub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U processhub" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://processhub:ci-password@localhost:5432/processhub_test?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      # pnpm in the version of package.json "packageManager" (Corepack ships with Node; replaces
      # pnpm/action-setup, which still ran on the deprecated Node 20 runtime).
      - run: corepack enable pnpm
      - id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @processhub/api prisma:generate
      - name: Format
        run: pnpm format:check
      - name: Translations (English / Arabic keys, placeholders, untranslated texts)
        run: node scripts/check-i18n.mjs
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test (shared, web unit, api unit + e2e)
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Web bundle budget (initial JavaScript ≤ 250 KB gzip)
        run: node apps/web/scripts/bundle-report.mjs --budget=250
      - name: Dependency audit (high/critical)
        run: pnpm audit --audit-level high --prod
      - name: Licence check (no copyleft in the shipped app, docs/SECURITY.md §9)
        run: node scripts/check-licenses.mjs

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - name: Image sizes
        run: docker images --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | grep -E 'migrate|api|web|renderer' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Production compose file is valid
        run: |
          cp .env.example.prod .env
          ./scripts/generate-secrets.sh
          docker compose config --quiet
      - name: Shell scripts (shellcheck)
        run: shellcheck -x -s sh scripts/*.sh
      # Trivy (pinned release image, not the GitHub action) on the four images built above: OS packages
      # and Node dependencies, High / Critical with a fixed version available fail the job; accepted
      # findings are listed with a reason in .trivyignore (docs/SECURITY.md §9).
      - name: Image scan (Trivy, High / Critical with a fix)
        run: |
          mkdir -p trivy-reports
          images="$(docker compose config --images | grep -E -- '-(api|migrate|web|renderer)$' | sort -u)"
          echo "Scanning: $images"
          status=0
          for image in $images; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work \
              -v trivy-cache:/root/.cache/trivy aquasec/trivy:0.67.2 image \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore \
              --exit-code 1 --format table --output "trivy-reports/${image##*/}.txt" "$image" || status=1
            cat "trivy-reports/${image##*/}.txt"
          done
          exit $status
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: trivy-reports
          path: trivy-reports
          retention-days: 14

  e2e:
    name: End-to-end (Docker Compose + Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      # pnpm in the version of package.json "packageManager" (Corepack ships with Node; replaces
      # pnpm/action-setup, which still ran on the deprecated Node 20 runtime).
      - run: corepack enable pnpm
      - id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Environment for the test stack
        # Defaults from docker-compose.yml (demo data, admin and demo users); the login rate limit
        # is raised because every test signs in from the same address.
        # The mock Salesforce of the e2e suite runs on the runner (host.docker.internal); secrets
        # of the Salesforce settings need an encryption key.
        run: |
          printf 'LOGIN_RATE_LIMIT_MAX=1000\nRATE_LIMIT_MAX=5000\nUSER_RATE_LIMIT_SCALE=100\n' > .env
          printf 'OUTBOUND_ALLOWED_HOSTS=mailpit,host.docker.internal,webhook-receiver\n' >> .env
          printf 'INTEGRATIONS_ENCRYPTION_KEY=%s\n' "$(openssl rand -base64 32)" >> .env
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Demo API key and renderer sandbox (D-180)
        # The seed shows a random demo key once (never the old fixed one); the renderer reports
        # whether Chromium's own sandbox is on (seccomp profile deploy/renderer-seccomp.json).
        run: |
          seed_log="$(docker compose logs --no-color migrate)"
          grep -q 'Demo API key (shown only once)' <<< "$seed_log"
          if grep -q 'phk_DemoKey' <<< "$seed_log"; then echo 'Fixed demo key found'; exit 1; fi
          docker compose exec -T renderer wget -qO- http://127.0.0.1:3100/health | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pnpm install --frozen-lockfile --filter @processhub/e2e
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm --filter @processhub/e2e exec playwright install --with-deps chromium
      - name: Playwright smoke tests
        run: pnpm e2e
      # OWASP ZAP baseline (passive scan of the running stack, pinned release). Rules that must hold are
      # FAIL in .zap/rules.tsv; the rest are reported as warnings (-I). Report kept as an artifact.
      - name: OWASP ZAP baseline scan
        run: |
          chmod 777 .zap
          docker run --rm --network host -v "$PWD/.zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.16.1 \
            zap-baseline.py -t "$E2E_BASE_URL" -c rules.tsv -I -r zap-report.html -J zap-report.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: zap-report
          path: .zap/zap-report.*
          retention-days: 14
      - name: Backup / restore drill (database, files, encryption key; timings in the log)
        run: ./scripts/backup-drill.sh --yes
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 300 migrate api web
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-results
          path: apps/e2e/test-results
          retention-days: 7
