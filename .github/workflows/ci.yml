name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: processhub
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: processhub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U processhub" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://processhub:ci-password@localhost:5432/processhub_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @processhub/api prisma:generate
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test (shared, web unit, api unit + e2e)
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Dependency audit (high/critical)
        run: pnpm audit --audit-level high --prod

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Production compose file is valid
        run: |
          cp .env.example.prod .env
          ./scripts/generate-secrets.sh
          docker compose config --quiet
      - name: Shell scripts (shellcheck)
        run: shellcheck -x -s sh scripts/*.sh

  e2e:
    name: End-to-end (Docker Compose + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Environment for the test stack
        # Defaults from docker-compose.yml (demo data, admin and demo users); the login rate limit
        # is raised because every test signs in from the same address.
        # The mock Salesforce of the e2e suite runs on the runner (host.docker.internal); secrets
        # of the Salesforce settings need an encryption key.
        run: |
          printf 'LOGIN_RATE_LIMIT_MAX=1000\nRATE_LIMIT_MAX=5000\n' > .env
          printf 'OUTBOUND_ALLOWED_HOSTS=mailpit,host.docker.internal\n' >> .env
          printf 'INTEGRATIONS_ENCRYPTION_KEY=%s\n' "$(openssl rand -base64 32)" >> .env
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - run: pnpm install --frozen-lockfile --filter @processhub/e2e
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm --filter @processhub/e2e exec playwright install --with-deps chromium
      - name: Playwright smoke tests
        run: pnpm e2e
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 300 api web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/e2e/test-results
          retention-days: 7
