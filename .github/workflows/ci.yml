name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: processhub
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: processhub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U processhub" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://processhub:ci-password@localhost:5432/processhub_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @processhub/api prisma:generate
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test (shared, web unit, api unit + e2e)
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Dependency audit (high/critical)
        run: pnpm audit --audit-level high --prod

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
