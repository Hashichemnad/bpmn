name: CI

# Runner image pinned (ubuntu-latest moves to new Ubuntu releases on its own); actions on their
# Node 24 majors (final session A).
on:
  push:
    branches: [main, 'phase-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: processhub
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: processhub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U processhub" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://processhub:ci-password@localhost:5432/processhub_test?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      # pnpm in the version of package.json "packageManager" (Corepack ships with Node; replaces
      # pnpm/action-setup, which still ran on the deprecated Node 20 runtime).
      - run: corepack enable pnpm
      - id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @processhub/api prisma:generate
      - name: Format
        run: pnpm format:check
      - name: Translations (English / Arabic keys, placeholders, untranslated texts)
        run: node scripts/check-i18n.mjs
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test (shared, web unit, api unit + e2e)
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Web bundle budget (initial JavaScript ≤ 250 KB gzip)
        run: node apps/web/scripts/bundle-report.mjs --budget=250
      - name: Dependency audit (high/critical)
        run: pnpm audit --audit-level high --prod

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - name: Image sizes
        run: docker images --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | grep -E 'migrate|api|web|renderer' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Production compose file is valid
        run: |
          cp .env.example.prod .env
          ./scripts/generate-secrets.sh
          docker compose config --quiet
      - name: Shell scripts (shellcheck)
        run: shellcheck -x -s sh scripts/*.sh

  e2e:
    name: End-to-end (Docker Compose + Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      # pnpm in the version of package.json "packageManager" (Corepack ships with Node; replaces
      # pnpm/action-setup, which still ran on the deprecated Node 20 runtime).
      - run: corepack enable pnpm
      - id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Environment for the test stack
        # Defaults from docker-compose.yml (demo data, admin and demo users); the login rate limit
        # is raised because every test signs in from the same address.
        # The mock Salesforce of the e2e suite runs on the runner (host.docker.internal); secrets
        # of the Salesforce settings need an encryption key.
        run: |
          printf 'LOGIN_RATE_LIMIT_MAX=1000\nRATE_LIMIT_MAX=5000\n' > .env
          printf 'OUTBOUND_ALLOWED_HOSTS=mailpit,host.docker.internal\n' >> .env
          printf 'INTEGRATIONS_ENCRYPTION_KEY=%s\n' "$(openssl rand -base64 32)" >> .env
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - run: pnpm install --frozen-lockfile --filter @processhub/e2e
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm --filter @processhub/e2e exec playwright install --with-deps chromium
      - name: Playwright smoke tests
        run: pnpm e2e
      - name: Backup / restore drill (database, files, encryption key; timings in the log)
        run: ./scripts/backup-drill.sh --yes
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 300 migrate api web
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-results
          path: apps/e2e/test-results
          retention-days: 7
