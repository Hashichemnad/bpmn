# Security headers for the SPA. Included in every location that serves files: nginx does not
# inherit add_header from the server block once a location declares its own add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Ant Design injects styles at runtime, hence 'unsafe-inline' for styles only (never for scripts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Strict-Transport-Security belongs on the TLS terminator in front of this container (docs/SECURITY.md).
