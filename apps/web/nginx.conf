# Serves the SPA and proxies /api to the API container (same origin: no CORS, strict cookies work).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # Attachments may be 10 MB (ATTACHMENT_MAX_BYTES) plus multipart overhead; the API enforces the exact
  # limits per route (BODY_LIMIT for JSON) and answers with a translated error instead of nginx's 413.
  client_max_body_size 11m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # AI assistant: responses are streamed (Server-Sent Events) and generation can take minutes.
  location /api/v1/ai/ {
    add_header Cache-Control "no-store" always;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  # Process mining (Phase 5.1): event log files up to MINING_UPLOAD_MAX_MB (default 200 MB); the API
  # checks the exact limit and the file type.
  location = /api/v1/mining/logs/upload {
    client_max_body_size 210m;
    client_body_timeout 300s;
    add_header Cache-Control "no-store" always;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  location /api/ {
    # The API sends its own security headers (helmet); this also stops inheriting the SPA headers above.
    add_header Cache-Control "no-store" always;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
