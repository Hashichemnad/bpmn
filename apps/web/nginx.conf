# Serves the SPA and proxies /api to the API container (same origin: no CORS, strict cookies work).

# Browsers that accept Brotli get the precompressed `.br` assets (apps/web/scripts/precompress.mjs);
# the official nginx image has no Brotli encoder, so only files compressed at build time are served
# as Brotli (final session, part A).
map $http_accept_encoding $ph_br {
  default 0;
  "~*(^|[\s,])br([\s,;]|$)" 1;
}

# Access log without the one-time tokens of invitation and unsubscribe links (final session part B,
# SEC-39); otherwise nginx's "combined" format.
map $request_uri $ph_log_uri {
  default $request_uri;
  "~^(?<ph_pre>.*/(?:invitations?|unsubscribe)/)[^/?#]+(?<ph_rest>.*)$" "${ph_pre}REDACTED${ph_rest}";
}
log_format ph_redacted '$remote_addr - $remote_user [$time_local] "$request_method $ph_log_uri $server_protocol" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  # Unprivileged image: port 8080 (no root needed to bind).
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  access_log /var/log/nginx/access.log ph_redacted;
  # Attachments may be 10 MB (ATTACHMENT_MAX_BYTES) plus multipart overhead; the API enforces the exact
  # limits per route (BODY_LIMIT for JSON) and answers with a translated error instead of nginx's 413.
  client_max_body_size 11m;

  # Dynamic responses (API JSON, index.html); assets use the precompressed files below.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # AI assistant: responses are streamed (Server-Sent Events) and generation can take minutes.
  location /api/v1/ai/ {
    add_header Cache-Control "no-store" always;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  # Process mining (Phase 5.1): event log files up to MINING_UPLOAD_MAX_MB (default 200 MB); the API
  # checks the exact limit and the file type.
  location = /api/v1/mining/logs/upload {
    client_max_body_size 210m;
    client_body_timeout 300s;
    add_header Cache-Control "no-store" always;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  location /api/ {
    # The API sends its own security headers (helmet); this also stops inheriting the SPA headers above.
    add_header Cache-Control "no-store" always;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Hashed file names: cached for a year. Text assets come precompressed: Brotli (.br) when the
  # browser accepts it and the file exists, otherwise gzip (.gz, gzip_static) or the plain file.
  location /assets/ {
    set $ph_brfile "";
    if ($ph_br) {
      set $ph_brfile "$request_filename.br";
    }
    if (-f $ph_brfile) {
      rewrite ^(.*)$ $1.br last;
    }
    gzip_static on;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location ~ ^/assets/.+\.js\.br$ {
    internal;
    gzip off;
    types {}
    default_type application/javascript;
    add_header Content-Encoding "br";
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location ~ ^/assets/.+\.css\.br$ {
    internal;
    gzip off;
    types {}
    default_type text/css;
    add_header Content-Encoding "br";
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location ~ ^/assets/.+\.svg\.br$ {
    internal;
    gzip off;
    types {}
    default_type image/svg+xml;
    add_header Content-Encoding "br";
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location ~ ^/assets/.+\.json\.br$ {
    internal;
    gzip off;
    types {}
    default_type application/json;
    add_header Content-Encoding "br";
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # index.html and other unhashed files: always revalidated (a new release is picked up at once).
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
