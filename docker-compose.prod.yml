# ProcessHub — production deployment on one server (docs/DEPLOYMENT.md).
#
#   cp .env.example.prod .env && ./scripts/generate-secrets.sh    # once; then edit DOMAIN, CADDY_TLS, admin
#   docker compose up -d --build                                  # .env sets COMPOSE_FILE to this file
#
# Only Caddy is published (ports 80 and 443). The database and the file storage sit on an internal network
# without internet access and without published ports; the API joins a second network for outbound calls
# (AI provider, GitHub / GitLab, SMTP).
#
# Every value below can be changed in .env; values marked ":?" must be set there (Compose refuses to start
# otherwise). Resource limits fit a 4 vCPU / 8 GB server (DEPLOYMENT.md "Server sizing").

name: ${COMPOSE_PROJECT_NAME:-processhub}

# Log rotation: Docker keeps at most 5 × 20 MB of logs per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-20m}
    max-file: '${LOG_MAX_FILES:-5}'

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11-alpine}
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (the host name users open, e.g. processhub.example.com)}
      CADDY_TLS: ${CADDY_TLS:?Set CADDY_TLS in .env (your e-mail for Let's Encrypt, or internal)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy-data:/data # certificates and the ACME account
      - caddy-config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: '${CADDY_CPUS:-1}', memory: '${CADDY_MEMORY:-256M}' }
    logging: *logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${PROCESSHUB_IMAGE_PREFIX:-processhub}-web:${PROCESSHUB_VERSION:-latest}
    restart: unless-stopped
    networks: [edge, backend]
    depends_on:
      api:
        condition: service_healthy
    # Health check: see apps/web/Dockerfile (GET /healthz).
    deploy:
      resources:
        limits: { cpus: '${WEB_CPUS:-1}', memory: '${WEB_MEMORY:-256M}' }
    logging: *logging

  api: &api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: ${PROCESSHUB_IMAGE_PREFIX:-processhub}-api:${PROCESSHUB_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: --max-old-space-size=${API_NODE_HEAP_MB:-1536}
      DATABASE_URL: postgresql://${POSTGRES_USER:-processhub}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-processhub}?schema=public
      # Required in production (generate-secrets.sh), so they live in .env and are backed up with it.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env (scripts/generate-secrets.sh)}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:?Set INTEGRATIONS_ENCRYPTION_KEY in .env (scripts/generate-secrets.sh)}
      # Only during a key rotation (docs/DEPLOYMENT.md "Key rotation", SEC-40).
      INTEGRATIONS_ENCRYPTION_KEY_PREVIOUS: ${INTEGRATIONS_ENCRYPTION_KEY_PREVIOUS:-}
      COOKIE_SECURE: 'true'
      APP_URL: https://${DOMAIN}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN}}
      # Caddy and nginx are in front of the API.
      TRUST_PROXY: ${TRUST_PROXY:-2}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      ENABLE_PUBLIC_API_DOCS: ${ENABLE_PUBLIC_API_DOCS:-false}
      MINIO_ENDPOINT: storage
      MINIO_PORT: 7070
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-processhub}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-processhub}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      SEED_SMTP_HOST: ${SEED_SMTP_HOST:-}
      OUTBOUND_ALLOWED_HOSTS: ${OUTBOUND_ALLOWED_HOSTS:-}
      # Emergency switch: password sign-in for everyone (see Settings → Authentication).
      AUTH_FORCE_LOCAL_LOGIN: ${AUTH_FORCE_LOCAL_LOGIN:-false}
      SSO_HTTP_TIMEOUT_MS: ${SSO_HTTP_TIMEOUT_MS:-15000}
      # Internal diagram / PDF renderer (D-172); empty RENDERER_URL turns server-side images off.
      RENDERER_URL: ${RENDERER_URL-http://renderer:3100}
      RENDERER_TOKEN: ${RENDERER_TOKEN:?Set RENDERER_TOKEN in .env (scripts/generate-secrets.sh)}
      # Every upload is scanned by ClamAV before it is stored (D-184); uploads are refused while the
      # scanner is not reachable (ANTIVIRUS_FAIL_OPEN=false).
      ANTIVIRUS: ${ANTIVIRUS:-clamav}
      CLAMAV_HOST: clamav
      ANTIVIRUS_FAIL_OPEN: ${ANTIVIRUS_FAIL_OPEN:-false}
    volumes:
      - api-data:/app/data
    networks: [backend, egress, render]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      clamav:
        condition: service_started
    # Health check: see apps/api/Dockerfile (GET /api/v1/health, checks the database).
    deploy:
      resources:
        limits: { cpus: '${API_CPUS:-2}', memory: '${API_MEMORY:-2G}' }
    logging: *logging

  # Database migrations and the seed (Prisma CLI), run once on every `docker compose up` before the
  # API starts; the API image itself has production dependencies only (final session A, D-168).
  migrate:
    <<: *api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: ${PROCESSHUB_IMAGE_PREFIX:-processhub}-api-migrate:${PROCESSHUB_VERSION:-latest}
    restart: 'no'
    command: ['migrate']
    healthcheck:
      disable: true
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy

  # Antivirus (ClamAV daemon, D-184): the API streams every upload to clamd (INSTREAM, port 3310 on the
  # internal network) before storing it. freshclam updates the signatures through `egress` (from
  # database.clamav.net, or the mirror set in /etc/clamav/freshclam.conf). The first start downloads
  # the signatures (a few minutes, ~300 MB); uploads wait for "healthy". Needs about 1.5 GB of RAM.
  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.4}
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: 'true'
    volumes:
      - clamav-db:/var/lib/clamav
    networks: [backend, egress]
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10m
    deploy:
      resources:
        limits: { cpus: '${CLAMAV_CPUS:-1}', memory: '${CLAMAV_MEMORY:-2G}' }
    logging: *logging

  # Diagram / PDF renderer (headless Chromium, D-172): only on the internal `render` network (no
  # internet, nothing published), read-only, unprivileged, without capabilities.
  renderer:
    build:
      context: .
      dockerfile: apps/renderer/Dockerfile
    image: ${PROCESSHUB_IMAGE_PREFIX:-processhub}-renderer:${PROCESSHUB_VERSION:-latest}
    restart: unless-stopped
    environment:
      RENDERER_TOKEN: ${RENDERER_TOKEN:?Set RENDERER_TOKEN in .env (scripts/generate-secrets.sh)}
      # Chromium's own sandbox (D-180): auto = on when the host allows user namespaces (with the
      # seccomp profile below), else --no-sandbox in this hardened container; on = required.
      RENDERER_SANDBOX: ${RENDERER_SANDBOX:-auto}
    # Unprivileged user (Dockerfile), no capabilities, read-only, internal network only.
    networks: [render]
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    # Docker's default seccomp profile + the namespace calls Chromium's sandbox needs (no capabilities).
    security_opt: ['no-new-privileges:true', 'seccomp=./deploy/renderer-seccomp.json']
    shm_size: 256mb
    deploy:
      resources:
        limits: { cpus: '${RENDERER_CPUS:-1.5}', memory: '${RENDERER_MEMORY:-1G}', pids: 512 }
    logging: *logging

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-processhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-processhub}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - log_min_duration_statement=${PG_LOG_SLOW_MS:-2000}
    shm_size: 256mb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: '${POSTGRES_CPUS:-2}', memory: '${POSTGRES_MEMORY:-2G}' }
    logging: *logging

  # File storage: Versity S3 Gateway, objects kept as plain files in the volume (DECISIONS D-051).
  storage:
    image: ${STORAGE_IMAGE:-versity/versitygw:v1.9.0}
    restart: unless-stopped
    entrypoint: ['sh', '-c']
    command:
      - mkdir -p /data/objects /data/meta && exec versitygw --port :7070 --health /health posix --fsync --sidecar /data/meta /data/objects
    environment:
      ROOT_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-processhub}
      ROOT_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    volumes:
      - storage-data:/data
    networks: [backend]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:7070/health']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: '${STORAGE_CPUS:-1}', memory: '${STORAGE_MEMORY:-512M}' }
    logging: *logging

networks:
  # Internet ↔ Caddy ↔ web.
  edge: {}
  # web, API, database and storage. No route to the internet and nothing published.
  backend:
    internal: true
  # Outbound calls of the API (AI provider, Git, SMTP, webhooks, Teams).
  egress: {}
  # API ↔ renderer only; no route to the internet.
  render:
    internal: true

volumes:
  clamav-db:
  postgres-data:
  storage-data:
  api-data:
  caddy-data:
  caddy-config:
