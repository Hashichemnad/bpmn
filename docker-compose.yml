# ProcessHub — local / single-server deployment.
#   cp .env.example .env   (optional for a local trial, required for real use)
#   docker compose up --build
# Then open http://localhost:8080 (or the WEB_PORT you configured).

name: processhub

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-processhub}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-processhub-local}
  POSTGRES_DB: ${POSTGRES_DB:-processhub}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: *db-env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible file storage: Versity S3 Gateway, objects kept as plain files in the volume
  # (docs/DECISIONS.md D-051). Only reachable inside the Compose network.
  storage:
    image: ${STORAGE_IMAGE:-versity/versitygw:v1.9.0}
    restart: unless-stopped
    entrypoint: ['sh', '-c']
    command:
      - mkdir -p /data/objects /data/meta && exec versitygw --port :7070 --health /health posix --fsync --sidecar /data/meta /data/objects
    environment:
      ROOT_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-processhub}
      ROOT_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-processhub-local-secret}
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:7070/health']
      interval: 5s
      timeout: 5s
      retries: 20

  # Local mail catcher: every email ProcessHub sends is shown at http://localhost:8025.
  # For production, configure a real SMTP server in Settings → Email and remove this service.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'

  # Local webhook test receiver (Phase 4.4): records what ProcessHub sends; requests are listed at
  # http://localhost:8090/received. Development / CI only — remove it for real installations.
  webhook-receiver:
    image: node:22-alpine
    restart: unless-stopped
    command: ['node', '/receiver/server.mjs']
    volumes:
      - ./apps/e2e/receiver:/receiver:ro
    ports:
      - '${WEBHOOK_RECEIVER_PORT:-8090}:8090'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8090/health']
      interval: 5s
      timeout: 3s
      retries: 10

  api: &api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    # Lets the API reach test doubles on the host (e2e mock Salesforce); only used when the host
    # is listed in OUTBOUND_ALLOWED_HOSTS.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-processhub}:${POSTGRES_PASSWORD:-processhub-local}@postgres:5432/${POSTGRES_DB:-processhub}?schema=public
      # Empty = generate a random secret on first start (stored in the api-data volume).
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      # Empty = generate a key on first start (stored in the api-data volume). Back it up with the
      # database: without it stored GitHub/GitLab tokens and the SMTP password cannot be decrypted.
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # File storage (S3-compatible; the MINIO_* names are kept for existing installations).
      MINIO_ENDPOINT: storage
      MINIO_PORT: 7070
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-processhub}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-processhub-local-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-processhub}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@processhub.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe-Admin1}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Demo-Password1}
      # Demo installations send email to Mailpit; real SMTP is configured in Settings → Email.
      SEED_SMTP_HOST: ${SEED_SMTP_HOST-mailpit}
      SEED_SMTP_PORT: ${SEED_SMTP_PORT:-1025}
      # Internal hosts the Git / SMTP integrations may reach (SSRF protection blocks all others).
      # Mailpit is internal; add your own GitLab / SMTP server here if it runs in a private network.
      # webhook-receiver: the local test receiver below (demo webhook, e2e tests).
      OUTBOUND_ALLOWED_HOSTS: ${OUTBOUND_ALLOWED_HOSTS-mailpit,webhook-receiver}
      # Emergency switch: password sign-in for everyone (see Settings → Authentication).
      AUTH_FORCE_LOCAL_LOGIN: ${AUTH_FORCE_LOCAL_LOGIN:-false}
      SSO_HTTP_TIMEOUT_MS: ${SSO_HTTP_TIMEOUT_MS:-15000}
      APP_URL: ${APP_URL:-http://localhost:8080}
      SCHEDULER_INTERVAL_MINUTES: ${SCHEDULER_INTERVAL_MINUTES:-60}
      MINING_UPLOAD_MAX_MB: ${MINING_UPLOAD_MAX_MB:-200}
      MINING_WORKERS: ${MINING_WORKERS:-true}
      WORKFLOW_POLL_SECONDS: ${WORKFLOW_POLL_SECONDS:-15}
      # Server-side diagram / PDF renderer (exports, report e-mails; D-172).
      RENDERER_URL: ${RENDERER_URL-http://renderer:3100}
      RENDERER_TOKEN: ${RENDERER_TOKEN:-processhub-local-renderer-token}
    networks: [default, render]
    volumes:
      - api-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Database migrations and the seed, once before the API starts (image without the Prisma CLI in
  # the API itself, final session A). `docker compose up` waits for it to finish successfully.
  migrate:
    <<: *api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    restart: 'no'
    command: ['migrate']
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Internal renderer (headless Chromium, D-172): reachable only from the API on the `render`
  # network, which has no internet access; read-only file system, no capabilities, resource limits.
  renderer:
    build:
      context: .
      dockerfile: apps/renderer/Dockerfile
    restart: unless-stopped
    environment:
      RENDERER_TOKEN: ${RENDERER_TOKEN:-processhub-local-renderer-token}
    networks: [render]
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    shm_size: 256m
    mem_limit: ${RENDERER_MEMORY:-1g}
    cpus: ${RENDERER_CPUS:-1.5}
    pids_limit: 512

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
  # No internet: only the API and the renderer are on it.
  render:
    internal: true

volumes:
  postgres-data:
  storage-data:
  api-data:
